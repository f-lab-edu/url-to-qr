name: Test AWS OIDC Authentication

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          echo "$PAYLOAD" | base64 -d 2>/dev/null | \
            jq '{iss, aud, sub, repository, repository_id, repository_owner_id, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: github-oidc-test

      - name: Verify AWS identity
        run: aws sts get-caller-identity
