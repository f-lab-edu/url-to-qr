name: Test AWS OIDC Authentication

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          python3 - "$TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          fields = [
              'iss',
              'aud',
              'sub',
              'repository',
              'repository_id',
              'repository_owner_id',
              'ref'
          ]

          print(json.dumps(
              {key: claims.get(key) for key in fields},
              indent=2
          ))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: github-oidc-test

      - name: Verify AWS identity
        run: aws sts get-caller-identity
