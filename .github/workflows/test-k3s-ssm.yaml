name: Test k3s EC2 SSM Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-k3s-ssm-test

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send test command
        id: send
        env:
          INSTANCE_ID: ${{ vars.K3S_EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID"

          jq -n \
            --arg instance "$INSTANCE_ID" \
            '{
              InstanceIds: [$instance],
              DocumentName: "AWS-RunShellScript",
              Comment: "Test GitHub Actions to k3s EC2",
              Parameters: {
                commands: [
                  "whoami",
                  "hostname",
                  "systemctl is-active k3s"
                ]
              }
            }' > ssm-request.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-request.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for command
        env:
          INSTANCE_ID: ${{ vars.K3S_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null) || {
                sleep 5
                continue
              }

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: SSM command monitoring timed out."
          exit 1

      - name: Display test result
        if: always() && steps.send.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ vars.K3S_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status:Status,
              ExitCode:ResponseCode,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }' \
            --output json
