name: Deploy URL to QR to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag (40-character Git SHA)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: url-to-qr-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Expected a full 40-character Git SHA."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-ssm-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send deployment command
        id: send
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          test -n "$INSTANCE_ID"

          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg command "bash /usr/local/bin/deploy-url-to-qr.sh $IMAGE_TAG" \
            '{
              InstanceIds: [$instance],
              DocumentName: "AWS-RunShellScript",
              Comment: "Deploy URL to QR via GitHub Actions",
              Parameters: {
                commands: [$command]
              }
            }' > ssm-request.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-request.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "ERROR: Deployment failed: $STATUS"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Deployment monitoring timed out."
          exit 1

      - name: Display deployment result
        if: always() && steps.send.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status:Status,
              ExitCode:ResponseCode,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }' \
            --output json
