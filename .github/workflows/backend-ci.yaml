name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
        
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v6

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Wrapper 실행 권한 설정
        run: chmod +x mvnw

      - name: 테스트 및 패키징
        run: ./mvnw --batch-mode verify